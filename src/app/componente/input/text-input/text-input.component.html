<div class="contenedor">
  <label *ngIf="mostarLabel" for="input">{{label}}<span *ngIf="required" class="requerido">  *</span><span class="aclaracion" *ngIf="mostrarAclaracion">{{aclaracion}}</span></label>
  
  <div class="input">

    <div
      [style]="style"
    >
      <div *ngIf="icono!==''" class="icon-izq">
        <ion-icon class="icon" name="{{icono}}"></ion-icon>
      </div>
      <input #input
        [value]="defaultValue"
        [type]="inputType"

        
        oninput="javascript: if (this.maxLength > 0) { if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength); }"
        [maxLength]="(largoMaximo)"
        

        [placeholder]="placeholder"
        [readOnly]="readOnly"
        [disabled]="disabled"
        [required]="required"
  
        style="width: 100%;"
  
        [ngClass]="{'error': error}"
  
        (input)="onInput($event.target)"
        (blur)="onTouched($event)"
        (focus)="onFocus()"
        />
    </div>
  </div>
  <div *ngIf="error" class="invalid-feedback">
    {{ errorTxt }}
  </div>
</div>
